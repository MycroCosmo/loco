name: loco_mobile
description: LOCO - Local Collection. 좋아하는 맛집과 장소를 지도에 저장하고 공유하는 플랫폼
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  # 상태 관리
  flutter_riverpod: ^2.5.1

  # 라우팅
  go_router: ^14.2.0

  # HTTP 클라이언트
  dio: ^5.4.3+1

  # 보안 토큰 저장
  flutter_secure_storage: ^9.2.2

  # 카카오 맵 WebView
  webview_flutter: ^4.8.0

  # 이미지 선택 (갤러리/카메라)
  image_picker: ^1.1.2

  # 네트워크 이미지 캐시 표시
  cached_network_image: ^3.4.1
  http_parser: ^4.0.2
  pointer_interceptor: ^0.10.1+2
  flutter_dotenv: ^5.2.1
  url_launcher: ^6.3.1

  # 공유
  share_plus: ^10.0.0

  # 로컬 설정 저장
  shared_preferences: ^2.3.0

  # Firebase (FCM 푸시 알림)
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

  # 기본 아이콘
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/loco_logo.png
