server:
  port: ${PORT:8081}
  servlet:
    context-path: /api

spring:
  application:
    name: loco-server-v3
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: false
    baseline-version: 1

management:
  endpoints:
    web:
      exposure:
        exclude: '*'
