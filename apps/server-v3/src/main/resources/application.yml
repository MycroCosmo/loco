server:
  port: ${PORT:8081}

spring:
  application:
    name: loco-server-v3
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASS:}
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: ${SMTP_SECURE:false}
      mail.smtp.starttls.enable: true
  config:
    import: optional:file:.env[.properties]
  web:
    resources:
      add-mappings: false
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: false
    baseline-version: 1

management:
  endpoints:
    web:
      exposure:
        exclude: '*'

loco:
  jwt:
    secret: ${JWT_SECRET}
