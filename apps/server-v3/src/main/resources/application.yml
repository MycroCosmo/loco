server:
  port: ${PORT:8081}
  servlet:
    context-path: /api

spring:
  application:
    name: loco-server-v3
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    # V1 baseline을 추가하는 2단계에서 활성화한다.
    enabled: false

management:
  endpoints:
    web:
      exposure:
        exclude: '*'
