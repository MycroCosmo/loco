server:
  port: ${PORT:8081}

spring:
  application:
    name: loco-server-v3
  config:
    import: optional:file:.env[.properties]
  web:
    resources:
      add-mappings: false
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: false
    baseline-version: 1

management:
  endpoints:
    web:
      exposure:
        exclude: '*'

loco:
  jwt:
    secret: ${JWT_SECRET}
