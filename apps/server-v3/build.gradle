plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
}

group = 'com.loco'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation platform(org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES)
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.security:spring-security-oauth2-jose'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.flywaydb:flyway-core'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'org.sejda.imageio:webp-imageio:0.1.6'
}

def v2Lockfile = file('../server/package-lock.json')
def prismaVersion = new groovy.json.JsonSlurper().parse(v2Lockfile).packages['node_modules/prisma'].version
def prismaToolsDirectory = layout.buildDirectory.dir('prisma-cli')

tasks.register('preparePrisma', Exec) {
    inputs.file(v2Lockfile)
    outputs.dir(prismaToolsDirectory)
    environment 'PRISMA_SKIP_POSTINSTALL_GENERATE', 'true'
    def npm = System.getProperty('os.name').toLowerCase().contains('windows')
            ? ['cmd.exe', '/d', '/c', 'npm.cmd'] : ['npm']
    commandLine npm + ['install', '--prefix', prismaToolsDirectory.get().asFile.absolutePath,
                       '--no-save', '--no-package-lock', '--no-audit', '--no-fund', "prisma@${prismaVersion}"]
}

tasks.withType(Test).configureEach {
    maxParallelForks = 1
    forkEvery = 0
    systemProperty 'junit.jupiter.execution.parallel.enabled', 'false'
    testLogging { events 'failed', 'skipped' }
}

tasks.named('test', Test) {
    description = '단위·v3 단독 테스트 (v2 및 Prisma CLI 실행 없음)'
    useJUnitPlatform { excludeTags 'v2-comparison' }
    systemProperty 'compat.v2.enabled', 'false'
    systemProperty 'compat.report', layout.buildDirectory.file('reports/fast/summary.json').get().asFile.absolutePath
    doFirst { delete layout.buildDirectory.file('reports/fast/summary.json') }
}

tasks.register('comparisonTest', Test) {
    description = 'v2 HTTP·라이브러리·Prisma 스키마 비교 테스트'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'v2-comparison' }
    systemProperty 'compat.v2.enabled', 'true'
    systemProperty 'users.observe', providers.gradleProperty('usersObserve').getOrElse('false')
    mustRunAfter tasks.named('test')
    dependsOn tasks.named('preparePrisma')
    inputs.file(v2Lockfile)
    inputs.file('../server/prisma/schema.prisma')
    inputs.dir('../server/src')
    inputs.files('../server/package.json', '../server/tsconfig.json', '../server/tsconfig.build.json', '../server/nest-cli.json')
    inputs.files('../../infra/docker/server-v2.Dockerfile', '../../infra/docker/start-v2.cjs')
    systemProperty 'compat.report', layout.buildDirectory.file('reports/compatibility/summary.json').get().asFile.absolutePath
    systemProperty 'prisma.cli', prismaToolsDirectory.get().file('node_modules/prisma/build/index.js').asFile.absolutePath
    systemProperty 'prisma.schema', file('../server/prisma/schema.prisma').absolutePath
    doFirst { delete layout.buildDirectory.file('reports/compatibility/summary.json') }
    doLast {
        def report = layout.buildDirectory.file('reports/compatibility/summary.json').get().asFile
        if (report.exists()) {
            def result = new groovy.json.JsonSlurper().parse(report)
            println "Compatibility: v2 builds=${result.v2Builds}, starts=${result.v2Starts}, restarts=${result.v2Restarts ?: 0}, auth wait=${result.authWaitMillis} ms"
            println "Known differences (알려진 차이): ${result.knownDifferences.size()} — ${report}"
            if (result.recommendContainerRestart) println '인증 대기 누적 180초 초과: C(같은 컨테이너 재시작) 전환을 검토하세요.'
        }
    }
}

tasks.register('allTests') {
    description = '빠른 테스트와 v2 비교 테스트를 모두 실행'
    group = 'verification'
    dependsOn tasks.named('test'), tasks.named('comparisonTest')
}

tasks.named('check') { dependsOn tasks.named('comparisonTest') }

tasks.register('codecTest', Test) {
    description = 'Java 21 이미지 코덱 호환성 검증 (DB·v2 서버 기동 없음)'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'image-codec' }
}

['test': 'local', 'codecTest': 'windows'].each { taskName, reportName ->
    tasks.named(taskName, Test) {
        def directory = layout.buildDirectory.dir("reports/codec/${reportName}")
        systemProperty 'codec.report.dir', directory.get().asFile.absolutePath
        doFirst {
            delete directory.get().file('summary.json').asFile, directory.get().file('summary.md').asFile
        }
        doLast {
            def report = directory.get().file('summary.json').asFile
            if (report.exists()) {
                def result = new groovy.json.JsonSlurper().parse(report)
                println "Codec: total=${result.total}, passed=${result.passed}, failed=${result.failed}, 알려진 차이/제약=${result.knownLimitations}"
                result.cases.findAll { it.status != 'PASS' }.each {
                    println "  ${it.format}: ${it.status}, v2 read=${it.v2Read} — ${it.detail}"
                }
            }
        }
    }
}

tasks.register('prepareCodecProbe', Sync) {
    dependsOn tasks.named('testClasses')
    from(configurations.testRuntimeClasspath) { into 'lib' }
    from(sourceSets.test.output) { into 'classes' }
    from(sourceSets.main.output) { into 'classes' }
    into layout.buildDirectory.dir('codec-probe')
}
