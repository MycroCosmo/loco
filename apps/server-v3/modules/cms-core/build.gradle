plugins {
    id 'java-library'
    id 'com.diffplug.spotless'
}

group = 'com.cms'
version = rootProject.version

java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
repositories { mavenCentral() }

spotless { java { googleJavaFormat('1.28.0') } }

dependencies {
    implementation platform(org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES)
    implementation 'org.springframework:spring-context'

    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.flywaydb:flyway-core'
    testRuntimeOnly 'org.flywaydb:flyway-database-postgresql'
    testRuntimeOnly 'org.postgresql:postgresql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// C-1: this library must remain usable without any host project, including in tests.
configurations.configureEach {
    withDependencies { dependencies ->
        if (dependencies.any { it instanceof ProjectDependency }) {
            throw new GradleException('cms-core must not depend on a host project')
        }
    }
}

tasks.named('test', Test) {
    useJUnitPlatform()
    maxParallelForks = 1
    doFirst {
        systemProperty 'cms.compile.classpath',
                sourceSets.main.output.classesDirs.asPath + File.pathSeparator + configurations.compileClasspath.asPath
    }
    testLogging { events 'failed', 'skipped' }
}
