name: Account regression
on:
  pull_request:
    paths:
      - 'apps/server/**'
      - '.github/workflows/account-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: loco_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: apps/server
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/loco_test
      JWT_SECRET: ci-only-secret-not-for-production-1234567890
      RUN_DB_REGRESSION: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/server/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma db push --skip-generate
      - run: npm test -- --runInBand
      - run: npm run build
      - run: npm run test:e2e -- --runInBand
